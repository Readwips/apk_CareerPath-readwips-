plugins {
    id "com.android.application"
}

def webAssetsDir = layout.buildDirectory.dir("generated/assets/web")

tasks.register("syncWebAssets", Copy) {
    from("../../outputs") {
        include "careerpath-app.html"
        include "careerpath-jobs.html"
        include "css/**"
        include "js/**"
    }
    into(webAssetsDir)
}

android {
    namespace "com.careerpath.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.careerpath.app"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main.assets.srcDir(webAssetsDir)
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity:1.8.0"
    implementation "com.google.android.gms:play-services-auth:21.2.0"
}

tasks.named("preBuild") {
    dependsOn("syncWebAssets")
}
